name: Feature idea
description: Something Action Center could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The design is in `docs/product-brief.md` and `docs/design/ui-spec.md`;
        items marked [REQ] or [DEC] there are settled, so say if your idea changes one.
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: The moment on the couch where Action Center falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How it could work with the remote's D-pad alone.
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Other launchers that do it, screenshots, the apps or services involved.
